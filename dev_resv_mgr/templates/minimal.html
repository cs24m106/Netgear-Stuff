<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Switch Manager</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- App theme (replace /static/theme.css with the file above) -->
  <link rel="stylesheet" href="/static/theme.css">

  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <div class="container-fluid py-3">
    <div class="topbar">
      <div style="display:flex; gap:0.8rem; align-items:center;">
        <h1 class="page-title mb-0">Netgear Switch Management UI</h1>
        <div class="meta-small">Operations · Lab · Dashboard</div>
      </div>

      <div class="toolbar">
        <!-- Theme toggle: JS should add/remove body[data-theme="dark"] -->
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-pressed="false" aria-label="Toggle theme">Toggle theme</button>

        <!-- Quick actions / helpful small buttons -->
        <div class="d-flex gap-2 align-items-center">
          <button id="refreshAll" class="btn btn-sm btn-outline-secondary" type="button" title="Refresh all devices">Refresh</button>
          <button id="downloadCsv" class="btn btn-sm btn-outline-secondary" type="button" title="Download CSV">Export</button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table id="devices_table" class="table table-striped table-borderless align-middle">
        <thead>
          <tr>
            <th class="col-left word-wrap" style="width: 8%;">Id</th>
            <th class="col-left word-wrap th-filter-col" style="width: 12%;">
              <div class="th-filter-head">
                <span class="th-filter-title">Model</span>
                <div class="filter-combo" data-filter-kind="model">
                  <div class="filter-combo-row">
                    <input type="text" id="filterModelInput" class="filter-combo-input" placeholder="all" autocomplete="off" aria-label="Filter by model" />
                    <button type="button" id="filterModelToggle" class="filter-combo-toggle" aria-label="Show model options" aria-expanded="false" title="Options">▾</button>
                    <button type="button" id="clearFilterModel" class="filter-clear" aria-label="Clear model filter">×</button>
                  </div>
                  <ul id="filterModelList" class="filter-combo-list" hidden role="listbox"></ul>
                </div>
              </div>
            </th>
            <th class="col-left word-wrap th-filter-col" style="width: 10%;">
              <div class="th-filter-head">
                <span class="th-filter-title">HW</span>
                <div class="filter-combo" data-filter-kind="hardware">
                  <div class="filter-combo-row">
                    <input type="text" id="filterHardwareInput" class="filter-combo-input" placeholder="all" autocomplete="off" aria-label="Filter by hardware" />
                    <button type="button" id="filterHardwareToggle" class="filter-combo-toggle" aria-label="Show hardware options" aria-expanded="false" title="Options">▾</button>
                    <button type="button" id="clearFilterHardware" class="filter-clear" aria-label="Clear hardware filter">×</button>
                  </div>
                  <ul id="filterHardwareList" class="filter-combo-list" hidden role="listbox"></ul>
                </div>
              </div>
            </th>
            <th class="col-center" style="width: 7%;">UI</th>
            <th class="col-left" style="width: 12%;">Mgmt-Ip</th>
            <th class="col-left" style="width: 9%;">Console</th> 
            <th class="col-left" style="width: 5%;">Health</th>       
            <th class="col-center" style="width: 5%;">Status</th>     
            <th class="col-left" style="width: 24%;">Reservation</th> 
            <th class="col-center" style="width: 8%;">Actions</th>
          </tr>
        </thead>
        <tbody id="devices_body">
          <!-- Rows are populated by /static/bootstrap.js -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js  "></script>

  <!-- Your application JS (we will update it in the next step) -->
  <script src="/static/bootstrap.js"></script>
</body>
</html>

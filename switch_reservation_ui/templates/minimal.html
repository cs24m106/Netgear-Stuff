<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Switch Manager</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- App theme (replace /static/theme.css with the file above) -->
  <link rel="stylesheet" href="/static/theme.css">

  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <div class="container-fluid py-3">
    <div class="topbar">
      <div style="display:flex; gap:0.8rem; align-items:center;">
        <h1 class="page-title mb-0">Netgear Switch Management UI</h1>
        <div class="meta-small">Operations · Lab · Dashboard</div>
      </div>

      <div class="toolbar">
        <!-- Theme toggle: JS should add/remove body[data-theme="dark"] -->
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-pressed="false" aria-label="Toggle theme">Toggle theme</button>

        <!-- Quick actions / helpful small buttons -->
        <div class="d-flex gap-2 align-items-center">
          <button id="refreshAll" class="btn btn-sm btn-outline-secondary" type="button" title="Refresh all devices">Refresh</button>
          <button id="downloadCsv" class="btn btn-sm btn-outline-secondary" type="button" title="Download CSV">Export</button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table id="devices_table" class="table table-striped align-middle">
        <thead>
          <tr>
            <th class="col-left word-wrap" style="width: 8%;">Id</th>
            <th class="col-left word-wrap" style="width: 14%;">Model</th>
            <th class="col-left word-wrap" style="width: 10%;">Serial</th>
            <th class="col-left word-wrap" style="width: 10%;">Hardware</th>
            <th class="col-center" style="width: 10%;">UI</th>
            <th class="col-left" style="width: 14%;">Mgmt-Ip</th>
            <th class="col-left" style="width: 5%;">Console</th> 
            <th class="col-left" style="width: 6%;">Health</th>       
            <th class="col-center" style="width: 8%;">Status</th>     
            <th class="col-left" style="width: 20%;">Reservation</th> 
            <th class="col-center" style="width: 9%;">Actions</th>
          </tr>
        </thead>
        <tbody id="devices_body">
          <!-- Rows are populated by /static/bootstrap.js -->
        </tbody>
      </table>
    </div>
    <div class="add-device-container" style="margin-top: 1rem; display: flex; justify-content: flex-end;">
      <button id="addDeviceBtn" class="btn btn-success" type="button">
        + Add Device
      </button>
    </div>
  </div>

  <!-- Bootstrap bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your application JS (we will update it in the next step) -->
  <script src="/static/bootstrap.js"></script>
</body>
</html>

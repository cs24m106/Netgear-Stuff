<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Switch Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 mb-0">Netgear Switch Management UI</h1>
      <div class="d-flex gap-2 align-items-center">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-pressed="false">Toggle theme</button>
      </div>
    </div>

    <table id="devices_table" class="table table-striped table-bordered align-middle">
      <thead>
        <tr>
          <th class="col-left word-wrap" style="width: 8%;">Id</th>
          <th class="col-left word-wrap" style="width: 14%;">Model</th>
          <th class="col-left word-wrap" style="width: 10%;">Hardware</th>
          <th class="col-center" style="width: 10%;">UI</th>
          <th class="col-left" style="width: 12%;">Mgmt-Ip</th>
          <th class="col-left" style="width: 6%;">Console</th> 
          <th class="col-left" style="width: 6%;">Health</th>       
          <th class="col-center" style="width: 9%;">Status</th>     
          <th class="col-left" style="width: 28%;">Reservation</th> 
          <th class="col-center" style="width: 9%;">Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/bootstrap.js"></script>
</body>
</html>
